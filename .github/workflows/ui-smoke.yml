name: Smoke test packaged UI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Renderer smoke test
    runs-on: ubuntu-latest
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Rebuild the pre-fix asset layout for comparison
        run: npx vite build --base=/ --outDir dist-abs --emptyOutDir

      - name: Install X virtual framebuffer and probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm install --no-save --ignore-scripts ws

      - name: Probe the renderer bundle over file://
        continue-on-error: true
        run: |
          set -euo pipefail
          export SMOKE_SCENARIOS="$(printf '[{"name":"old-absolute-file","url":"file://%s/dist-abs/index.html"},{"name":"fixed-relative-file","url":"file://%s/dist/index.html"}]' "$PWD" "$PWD")"
          xvfb-run -a --server-args="-screen 0 1440x920x24" \
            npx electron --no-sandbox --disable-gpu scripts/ui-smoke/renderer-probe.cjs 2>&1 | tee probe-renderer.log

      - name: Package the application
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --linux --dir --x64 --publish never 2>&1 | tail -20
          echo "--- packaged output ---"
          ls -la release/linux-unpacked | head -20

      - name: Probe the packaged application
        continue-on-error: true
        run: |
          set -uo pipefail
          APP_BIN=$(find release/linux-unpacked -maxdepth 1 -type f -executable -name 'loader' | head -n 1)
          if [ -z "$APP_BIN" ]; then
            APP_BIN=$(find release/linux-unpacked -maxdepth 1 -type f -executable \
              ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' | head -n 1)
          fi
          if [ -z "$APP_BIN" ]; then
            echo "No packaged application binary found" | tee probe-app.log
            exit 1
          fi
          echo "Launching $APP_BIN"
          xvfb-run -a --server-args="-screen 0 1440x920x24" "$APP_BIN" \
            --no-sandbox --disable-gpu --remote-debugging-port=9222 > probe-app.log 2>&1 &
          APP_PID=$!
          sleep 4
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "The application is still running four seconds after launch."
          else
            echo "The application exited within four seconds of launch."
          fi
          ss -ltnp 2>/dev/null | grep -E '9222|LISTEN' | head -5 || true
          APP_LOG="$HOME/.config/Loader/logs/main.log"
          if [ -f "$APP_LOG" ]; then
            echo "--- electron-log: $APP_LOG ---"
            tail -n 40 "$APP_LOG"
          else
            echo "--- no electron-log file at $APP_LOG ---"
          fi
          node scripts/ui-smoke/app-probe.cjs 2>&1 | tee -a probe-app.log
          STATUS=${PIPESTATUS[0]}
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null
          echo "Application exit status: $?"
          exit "$STATUS"

      - name: Report renderer results
        if: always()
        run: |
          set -uo pipefail
          node scripts/ui-smoke/report.cjs | tee probe-report.log
          tail -n 1 probe-report.log > probe-output.json
          {
            echo '### Renderer smoke test'
            echo
            echo '```json'
            cat probe-output.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface probe logs
        if: always()
        run: |
          set -uo pipefail
          for file in probe-renderer.log probe-app.log; do
            [ -f "$file" ] || continue
            FILE="$file" node -e '
              const fs = require("node:fs");
              const escape = (value) => String(value).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A").slice(0, 900);
              const lines = fs.readFileSync(process.env.FILE, "utf8").split("\n").filter((line) => line.trim()).slice(-12);
              for (const line of lines) console.log(`::warning title=${process.env.FILE}::${escape(line)}`);
            '
          done

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: |
            smoke-screenshots/*.png
            smoke-report.json
            probe-app.log
            probe-renderer.log
          if-no-files-found: warn
          retention-days: 7
