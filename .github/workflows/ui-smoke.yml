name: Smoke test packaged UI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Renderer smoke test
    runs-on: ubuntu-latest
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Rebuild the pre-fix asset layout for comparison
        run: npx vite build --base=/ --outDir dist-abs --emptyOutDir

      - name: Install X virtual framebuffer and probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm install --no-save --ignore-scripts ws

      - name: Probe the renderer bundle over file://
        continue-on-error: true
        run: |
          set -euo pipefail
          export SMOKE_SCENARIOS="$(printf '[{"name":"old-absolute-file","url":"file://%s/dist-abs/index.html"},{"name":"fixed-relative-file","url":"file://%s/dist/index.html"}]' "$PWD" "$PWD")"
          xvfb-run -a --server-args="-screen 0 1440x920x24" \
            npx electron --no-sandbox --disable-gpu --disable-dev-shm-usage scripts/ui-smoke/renderer-probe.cjs 2>&1 | tee probe-renderer.log

      - name: Package the application
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --linux --dir --x64 --publish never 2>&1 | tail -20
          echo "--- packaged output ---"
          ls -la release/linux-unpacked | head -20

      - name: Probe the packaged application
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          LOG=probe-app.log
          : > "$LOG"
          exec >> "$LOG" 2>&1
          set -x

          echo "--- packaged output ---"
          ls -la release/linux-unpacked | head -30

          APP_BIN=$(find release/linux-unpacked -maxdepth 1 -type f -executable -iname 'loader*' | head -n 1)
          if [ -z "$APP_BIN" ]; then
            APP_BIN=$(find release/linux-unpacked -maxdepth 1 -type f -executable \
              ! -name '*.*' ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' | head -n 1)
          fi
          case "$APP_BIN" in
            *.so*|*chrome-sandbox*|*chrome_crashpad_handler*|"")
              echo "Refusing to run '${APP_BIN:-<empty>}' as the application binary"
              exit 1
              ;;
          esac
          echo "Packaged binary: $APP_BIN"
          test -x "$APP_BIN" || exit 1

          echo "--- archive contents ---"
          node -e '
            const asar = require("@electron/asar");
            const files = asar.listPackage("release/linux-unpacked/resources/app.asar");
            const wanted = files.filter((file) => /dist\/index\.html|dist-electron\/electron\/(main|preload)\.js|dist\/assets\//.test(file));
            console.log(wanted.slice(0, 6).join("\n") || "(no renderer entries found)");
            console.log("total entries:", files.length);
          ' || echo "asar inspection failed"

          echo "--- unpacked native module ---"
          find release/linux-unpacked/resources/app.asar.unpacked -name '*.node' || echo "nothing unpacked"
          UNPACKED="$PWD/release/linux-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3"
          export UNPACKED

          echo "--- preflight: packaged binary reports its version ---"
          timeout 60 "$APP_BIN" --no-sandbox --version
          echo "preflight exit: $?"

          echo "--- preflight: native module loads in the packaged runtime ---"
          ELECTRON_RUN_AS_NODE=1 timeout 60 "$APP_BIN" -e 'try { require(process.env.UNPACKED); console.log("better-sqlite3 loaded"); } catch (error) { console.log("better-sqlite3 failed: " + error.message); }'
          echo "native module check exit: $?"

          echo "--- scenario 1: packaged binary ---"
          xvfb-run -a --server-args="-screen 0 1440x920x24" "$APP_BIN" \
            --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 &
          APP_PID=$!
          sleep 8
          if kill -0 "$APP_PID" 2>/dev/null; then echo "app alive eight seconds after launch"; else echo "app exited within eight seconds"; fi
          ss -ltn | head -10 || true
          echo "--- application log ---"
          tail -n 40 "$HOME/.config/Loader/logs/main.log" 2>/dev/null || echo "no application log"
          node scripts/ui-smoke/app-probe.cjs
          echo "scenario 1 probe exit: $?"
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null
          echo "scenario 1 application exit status: $?"

          echo "--- scenario 2: same archive served by the workspace electron ---"
          xvfb-run -a --server-args="-screen 0 1440x920x24" \
            npx electron --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9223 \
            release/linux-unpacked/resources/app.asar &
          ASAR_PID=$!
          sleep 8
          if kill -0 "$ASAR_PID" 2>/dev/null; then echo "archive app alive eight seconds after launch"; else echo "archive app exited within eight seconds"; fi
          CDP_PORT=9223 SMOKE_LABEL=archive-via-workspace-electron node scripts/ui-smoke/app-probe.cjs
          echo "scenario 2 probe exit: $?"
          kill "$ASAR_PID" 2>/dev/null || true

      - name: Report renderer results
        if: always()
        run: |
          set -uo pipefail
          node scripts/ui-smoke/report.cjs | tee probe-report.log
          tail -n 1 probe-report.log > probe-output.json
          {
            echo '### Renderer smoke test'
            echo
            echo '```json'
            cat probe-output.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface probe logs
        if: always()
        run: |
          set -uo pipefail
          for file in probe-app.log probe-renderer.log; do
            [ -f "$file" ] || continue
            FILE="$file" node -e '
              const fs = require("node:fs");
              const escape = (value) => String(value).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A").slice(0, 900);
              const noise = /dbus|NameHasOwner|DevTools listening|libva|MESA|ContextResult/i;
              const lines = fs.readFileSync(process.env.FILE, "utf8").split("\n").filter((line) => line.trim() && !noise.test(line));
              const selected = process.env.FILE === "probe-app.log" ? lines.slice(-24) : lines.slice(-8);
              for (const line of selected) console.log(`::warning title=${process.env.FILE}::${escape(line)}`);
            '
          done

      - name: Publish smoke report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_PR: ${{ github.event.pull_request.number }}
        run: node scripts/ui-smoke/publish.cjs

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: |
            smoke-screenshots/*.png
            smoke-report.json
            probe-app.log
            probe-renderer.log
          if-no-files-found: warn
          retention-days: 7
